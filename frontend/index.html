<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprendizaje</title>
  <link rel="stylesheet" href="css/estilos.css?v=5">
  <link rel="stylesheet" href="css/unidades.css?v=2">
  <link rel="stylesheet" href="css/recomendacion.css?v=1">
  <link rel="stylesheet" href="css/menu_lateral.css?v=1">
</head>
<body>
  <main class="contenedor contenedor-inicio">
    <div class="layout-inicio">

      <!-- Menú lateral: cada sección con su icono y nombre -->
      <aside>
        <nav class="menu-lateral" aria-label="Menú principal">
          <a href="index.html" class="activo"><span class="icono-menu">🏠</span>Inicio</a>
          <a href="perfil.html"><span class="icono-menu">👤</span>Mi perfil</a>
          <a href="estudio.html"><span class="icono-menu">📊</span>Mis datos</a>
          <a href="laboratorios.html"><span class="icono-menu">🧪</span>Laboratorios</a>
          <a href="aprende_r.html"><span class="icono-menu">💻</span>Aprende R</a>
          <a href="libre.html"><span class="icono-menu">📄</span>Modo libre</a>
          <a href="logros.html"><span class="icono-menu">🏆</span>Logros</a>
          <a href="avatar.html"><span class="icono-menu">🤖</span>Avatar</a>
          <div class="separador"></div>
          <button id="boton-salir" class="enlace-boton"><span class="icono-menu">🚪</span>Cerrar sesión</button>
        </nav>
      </aside>

      <!-- Contenido principal -->
      <div class="contenido-inicio">
        <!-- Panel con el nivel y la XP del usuario -->
        <section class="panel-usuario">
          <div class="fila-usuario">
            <div class="identidad">
              <div id="avatar-mini" class="avatar-mini"></div>
              <strong id="nombre-usuario">...</strong>
            </div>
            <span class="etiqueta-nivel">Nivel <span id="nivel">1</span></span>
          </div>
          <div class="barra barra-xp"><div id="barra-xp" class="barra-relleno barra-relleno-xp"></div></div>
          <small id="texto-xp"></small>
          <div class="fichas">
            <span class="ficha" id="ficha-racha">🔥 Racha: 0 días</span>
            <span class="ficha" id="ficha-monedas">🪙 0 monedas</span>
          </div>
        </section>

        <!-- Recomendación según la clasificación del usuario (riesgo de abandono y perfil de estudio) -->
        <section id="tarjeta-reco" class="tarjeta-reco oculto" aria-live="polite">
          <div class="reco-cabecera">
            <h2>💡 Recomendado para ti</h2>
            <span id="reco-chip-riesgo" class="chip-riesgo"></span>
          </div>
          <p id="reco-perfil" class="reco-perfil"></p>
          <p id="reco-consejo" class="reco-consejo"></p>
          <div class="reco-principal">
            <h3 id="reco-titulo"></h3>
            <p id="reco-texto"></p>
            <a id="reco-boton" class="boton" href="#"></a>
            <p id="reco-relacionada" class="reco-relacionada oculto"></p>
          </div>
          <div id="reco-extra" class="reco-extra oculto">
            <strong id="reco-extra-titulo"></strong>
            <span id="reco-extra-texto"></span>
            <a id="reco-extra-enlace" href="#"></a>
          </div>
          <a class="reco-mas" href="estudio.html">Ver mis datos de estudio →</a>
        </section>

        <h1 id="titulo-curso">Cargando...</h1>
        <p id="descripcion-curso"></p>
        <div id="lista-lecciones"></div>
      </div>

    </div>
  </main>

  <script src="js/api.js?v=7"></script>
  <script src="js/avatar.js?v=5"></script>
  <script src="js/inicio.js?v=6"></script>
  <script src="js/recomendacion.js?v=1"></script>
</body>
</html>
